<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServEasy - Feedback & Ajuda</title>
    <link rel="stylesheet" href="../../styles/cliente-atendente/cliente-atendente-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" aria-label="Sidebar de navegação">
            <div class="header-box" role="banner">
                <div style="display: flex; align-items: center; gap: 0.9rem">
                    <div
                        style="
                            width: 46px;
                            height: 46px;
                            border-radius: 10px;
                            background: linear-gradient(
                                90deg,
                                var(--btn-bg),
                                var(--btn-hover-end)
                            );
                            box-shadow: 0 6px 18px var(--btn-shadow);
                        "
                    ></div>
                    <div>
                        <div class="title">ServEasy</div>
                        <div class="subtitle">Services.</div>
                    </div>
                </div>
            </div>

            <nav class="nav-list" aria-label="Navegação principal">
                <a href="cardapio.html">
                    <button class="nav-btn">
                        <div
                            style="
                                width: 10px;
                                height: 10px;
                                border-radius: 50%;
                                background: #6b7280;
                            "
                        ></div>
                        Cardápio
                    </button>
                </a>
                <a href="seus-pedidos.html">
                    <button class="nav-btn">
                        <div
                            style="
                                width: 10px;
                                height: 10px;
                                border-radius: 50%;
                                background: #6b7280;
                            "
                        ></div>
                        Seus Pedidos
                    </button>
                </a>
                <button class="nav-btn" aria-current="page">
                    <div class="dot" aria-hidden="true"></div>
                    Feedback & Ajuda
                </button>
            </nav>

            <div class="logout">
                <a href="../login.html">
                    <button class="nav-btn" id="logoutBtn" title="Sair">Sair</button>
                </a>
            </div>
        </aside>

        <main class="main" role="main">
            <div class="main-header">
                <h1>Feedback & Ajuda</h1>
                <div class="mesa-ativa" id="mesaAtiva" style="display: none;">
                    <i class="fas fa-table"></i>
                    <span id="mesaNumero">Mesa 0</span>
                </div>
            </div>

            <div class="feedback-container">
                <!-- Abas de Navegação -->
                <div style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333;">
                    <button class="tab-btn active" data-tab="feedback" onclick="trocarAba('feedback')">
                        <i class="fas fa-star"></i>
                        Dar Feedback
                    </button>
                    <button class="tab-btn" data-tab="ajuda" onclick="trocarAba('ajuda')">
                        <i class="fas fa-question-circle"></i>
                        Pedir Ajuda
                    </button>
                </div>

                <!-- Aba de Feedback -->
                <div id="tab-feedback" class="tab-content">
                    <div class="feedback-form">
                        <h2 style="color: #fca311; margin-bottom: 20px;">
                            <i class="fas fa-star"></i>
                            Como foi sua experiência?
                        </h2>
                        
                        <form id="feedbackForm">
                            <div class="form-group">
                                <label>Tipo de Feedback</label>
                                <div class="select-wrapper">
                                    <select id="tipoFeedback" required>
                                        <option value="">Selecione o tipo</option>
                                        <option value="experiencia">Experiência Geral</option>
                                        <option value="comida">Qualidade da Comida</option>
                                        <option value="atendimento">Atendimento</option>
                                        <option value="ambiente">Ambiente</option>
                                        <option value="preco">Preço/Custo-benefício</option>
                                        <option value="sugestao">Sugestão</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Avaliação Geral</label>
                                <div class="rating-container" style="display: flex; gap: 10px; align-items: center; margin: 10px 0;">
                                    <div class="stars" id="ratingStars">
                                        <i class="far fa-star" data-rating="1"></i>
                                        <i class="far fa-star" data-rating="2"></i>
                                        <i class="far fa-star" data-rating="3"></i>
                                        <i class="far fa-star" data-rating="4"></i>
                                        <i class="far fa-star" data-rating="5"></i>
                                    </div>
                                    <span id="ratingText" style="color: #999;">Selecione uma avaliação</span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Nome (opcional)</label>
                                <input type="text" id="nomeCliente" placeholder="Seu nome ou apelido">
                            </div>

                            <div class="form-group">
                                <label>Comentário</label>
                                <textarea id="comentarioFeedback" placeholder="Conte-nos mais sobre sua experiência..." required></textarea>
                            </div>

                            <button type="submit" class="btn-enviar">
                                <i class="fas fa-paper-plane"></i>
                                Enviar Feedback
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Aba de Ajuda -->
                <div id="tab-ajuda" class="tab-content" style="display: none;">
                    <div class="feedback-form">
                        <h2 style="color: #fca311; margin-bottom: 20px;">
                            <i class="fas fa-question-circle"></i>
                            Precisa de ajuda?
                        </h2>
                        
                        <form id="ajudaForm">
                            <div class="form-group">
                                <label>Tipo de Problema</label>
                                <div class="select-wrapper">
                                    <select id="tipoProblema" required>
                                        <option value="">Selecione o tipo</option>
                                        <option value="pedido">Problema com Pedido</option>
                                        <option value="pagamento">Problema com Pagamento</option>
                                        <option value="produto">Problema com Produto</option>
                                        <option value="sistema">Problema no Sistema</option>
                                        <option value="atendimento">Chamada do Garçom</option>
                                        <option value="outros">Outros</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Prioridade</label>
                                <div class="select-wrapper">
                                    <select id="prioridadeAjuda" required>
                                        <option value="baixa">Baixa - Não é urgente</option>
                                        <option value="media">Média - Moderadamente importante</option>
                                        <option value="alta">Alta - Preciso de atenção rápida</option>
                                        <option value="urgente">Urgente - Problema crítico</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Descrição do Problema</label>
                                <textarea id="descricaoProblema" placeholder="Descreva o problema ou o que você precisa..." required></textarea>
                            </div>

                            <div class="form-group">
                                <label>Número do Pedido (se aplicável)</label>
                                <input type="text" id="numeroPedidoAjuda" placeholder="Ex: #001, #123">
                            </div>

                            <button type="submit" class="btn-enviar">
                                <i class="fas fa-hands-helping"></i>
                                Solicitar Ajuda
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Sucesso -->
    <div id="modalSucesso" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <div style="color: #28a745; font-size: 3rem; margin-bottom: 15px;">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 style="color: #28a745; margin-bottom: 10px;">Enviado com Sucesso!</h2>
            <p id="mensagemSucesso" style="color: #cccccc; margin-bottom: 20px;">
                Seu feedback foi enviado com sucesso. Obrigado!
            </p>
            <button onclick="fecharModalSucesso()" class="add-btn">
                <i class="fas fa-check"></i>
                OK
            </button>
        </div>
    </div>

    <script src="../../scripts/cliente-atendente/feedback.js"></script>
    <style>
        .tab-btn {
            background: rgba(255, 255, 255, 0.02);
            color: var(--body-text);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 12px 20px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background: rgba(252, 163, 17, 0.1);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--btn-bg), var(--btn-hover-end));
            color: var(--btn-text);
            border-color: var(--btn-bg);
        }

        .stars {
            display: flex;
            gap: 5px;
        }

        .stars i {
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #666;
        }

        .stars i:hover,
        .stars i.active {
            color: #fca311;
        }

        .historico-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .historico-item:hover {
            border-color: var(--btn-bg);
            background: rgba(252, 163, 17, 0.05);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-pendente {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .status-resolvido {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
        }

        .status-em-andamento {
            background: rgba(23, 162, 184, 0.2);
            color: #17a2b8;
        }
    </style>
</body>
</html>
