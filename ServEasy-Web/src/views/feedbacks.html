<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServEasy - Feedbacks</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    

    <link rel="stylesheet" href="../styles/feedbacks.css" />
  </head>

  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Sidebar de navegação">
        <div class="header-box" role="banner">
          <div style="display: flex; align-items: center; gap: 0.9rem">
            <div
              style="
                width: 46px;
                height: 46px;
                border-radius: 10px;
                background: linear-gradient(
                  90deg,
                  var(--btn-bg),
                  var(--btn-hover-end)
                );
                box-shadow: 0 6px 18px var(--btn-shadow);
              "
            ></div>
            <div>
              <div class="title">ServEasy</div>
              <div class="subtitle">Services.</div>
            </div>
          </div>
        </div>

        <nav class="nav-list">
          <a href="dashboard.html"
            ><button class="nav-btn">
              <div
                style="
                  width: 10px;
                  height: 10px;
                  border-radius: 50%;
                  background: #6b7280;
                "
              ></div>
              Dashboard
            </button></a
          >
          <a href="menu.html"
            ><button class="nav-btn">
              <div
                style="
                  width: 10px;
                  height: 10px;
                  border-radius: 50%;
                  background: #6b7280;
                "
              ></div>
              Cardápio
            </button></a
          >
          <a href="mesas.html"
            ><button class="nav-btn">
              <div
                style="
                  width: 10px;
                  height: 10px;
                  border-radius: 50%;
                  background: #6b7280;
                "
              ></div>
              Mesas
            </button></a
          >
          <a href="stock.html"
            ><button class="nav-btn">
              <div
                style="
                  width: 10px;
                  height: 10px;
                  border-radius: 50%;
                  background: #6b7280;
                "
              ></div>
              Estoque
            </button></a
          >
          <button class="nav-btn" aria-current="page">
            <div class="dot" aria-hidden="true"></div>
            Feedbacks
          </button>
        </nav>

        <div class="logout">
          <a href="login.html">
            <button class="nav-btn" id="logoutBtn" title="Sair">Sair</button>
          </a>
        </div>
      </aside>

      <main class="main">
        <div class="main-header">
          <h1>Feedbacks</h1>
        </div>

        <div class="feedback-table-container">
          <table class="feedback-table">
            <thead>
              <tr>
                <th>Usuário</th>
                <th>Comentário</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="feedbackBody"></tbody>
          </table>
        </div>

        <!-- Modal de Confirmação -->
        <div id="confirmModal" class="modal-overlay">
          <div class="modal-container confirm-modal">
            <div class="confirm-content">
              <div class="confirm-icon">!</div>
              <h3 id="confirmTitle">Remover feedback</h3>
              <p id="confirmMessage">
                Tem certeza que deseja remover este feedback?
              </p>
              <div class="confirm-actions">
                <button id="confirmCancel" class="btn-cancel">Cancelar</button>
                <button id="confirmOk" class="btn-confirm">Confirmar</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="../scripts/feedbacks.js"></script>
  </body>
</html>
