<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServEasy - Login</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Fonte Elegante -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..300&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../styles/login-styles.css" />
  </head>

  <body>
    <div class="login-container">
      <!-- Cabeçalho com fundo laranja -->
      <div class="header-box">
        <div class="title">ServEasy</div>
        <div class="subtitle">Services.</div>
      </div>

      <!-- Formulário -->
      <form>
        <div class="mb-3">
          <label for="username" class="form-label">Usuário</label>
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Digite seu usuário"
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Digite sua senha"
          />
        </div>
        <button type="submit" class="btn btn-login mt-3" id="AccessButton">Acessar</button>
      </form>
    </div>
    <script src="../scripts/login.js"></script>
  </body>
</html>
