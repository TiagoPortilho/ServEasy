<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste JWT</title>
    <script src="/scripts/jwt-interceptor.js"></script>
</head>
<body>
    <h1>Teste JWT Interceptor</h1>
    <button onclick="testLogin()">1. Login Admin</button>
    <button onclick="testLoginCozinheiro()">2. Login Cozinheiro</button>
    <button onclick="testDashboard()">3. Testar Dashboard</button>
    <button onclick="testTables()">4. Testar Tables API</button>
    <button onclick="testStock()">5. Testar Stock API</button>
    <button onclick="checkLocalStorage()">6. Verificar localStorage</button>
    <button onclick="testLogout()">7. Logout</button>
    <div id="result"></div>

    <script>
        const result = document.getElementById('result');

        async function testLoginCozinheiro() {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'cozinheiro', password: 'cozinha123' })
                });
                const data = await response.json();
                result.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
                if (data.status === 'success') {
                    localStorage.setItem('jwt_token', data.data.token);
                    localStorage.setItem('user_role', data.data.role);
                    localStorage.setItem('username', data.data.username);
                    result.innerHTML += '<p style="color: green">Token salvo no localStorage!</p>';
                    result.innerHTML += '<p>Role: ' + data.data.role + '</p>';
                    result.innerHTML += '<p>Redirect URL: ' + (data.data.redirectUrl || 'N/A') + '</p>';
                }
            } catch (error) {
                result.innerHTML = '<p style="color: red">Erro: ' + error.message + '</p>';
            }
        }

        async function testTables() {
            try {
                const response = await fetch('/api/tables');
                const data = await response.json();
                result.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                result.innerHTML = '<p style="color: red">Erro: ' + error.message + '</p>';
            }
        }

        async function testStock() {
            try {
                const response = await fetch('/api/stock');
                const data = await response.json();
                result.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                result.innerHTML = '<p style="color: red">Erro: ' + error.message + '</p>';
            }
        }

        function checkLocalStorage() {
            const token = localStorage.getItem('jwt_token');
            const role = localStorage.getItem('user_role');
            const username = localStorage.getItem('username');
            result.innerHTML = `
                <p><strong>Token:</strong> ${token ? token.substring(0, 20) + '...' : 'NÃO ENCONTRADO'}</p>
                <p><strong>Role:</strong> ${role || 'NÃO ENCONTRADO'}</p>
                <p><strong>Username:</strong> ${username || 'NÃO ENCONTRADO'}</p>
            `;
        }
            localStorage.removeItem('username');
            result.innerHTML = '<p style="color: green">Logout realizado!</p>';
        
    </script>
</body>
</html>
