<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ServEasy - Menu</title>

    <!-- Bootstrap utilitários -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Estilos do projeto -->
    <link rel="stylesheet" th:href="@{/styles/admin/admin-styles.css}">
    
    <!-- JWT Interceptor - deve ser carregado primeiro -->
    <script th:src="@{/scripts/jwt-interceptor.js}"></script>
  </head>

  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Sidebar de navegação">
        <div class="header-box" role="banner">
          <div style="display:flex; align-items:center; gap:0.9rem;">
            <div style="width:46px; height:46px; border-radius:10px; background:linear-gradient(90deg,var(--btn-bg), var(--btn-hover-end)); box-shadow:0 6px 18px var(--btn-shadow);"></div>
            <div>
              <div class="title">ServEasy</div>
              <div class="subtitle">Services.</div>
            </div>
          </div>
        </div>

        <nav class="nav-list" aria-label="Navegação principal">
          <a th:href="@{/admin/dashboard}"><button class="nav-btn">
            <div style="width:10px;height:10px;border-radius:50%;background:#6b7280"></div>
            Dashboard
          </button></a>

          <button class="nav-btn" aria-current="page">
            <div class="dot" aria-hidden="true"></div>
            Cardápio
          </button>

          <a th:href="@{/admin/tables}"><button class="nav-btn">
            <div style="width:10px;height:10px;border-radius:50%;background:#6b7280"></div>
            Mesas
          </button></a>

          <a th:href="@{/admin/stock}"><button class="nav-btn">
            <div style="width:10px;height:10px;border-radius:50%;background:#6b7280"></div>Estoque
          </button></a>
          <a th:href="@{/admin/feedbacks}"><button class="nav-btn">
            <div style="width:10px;height:10px;border-radius:50%;background:#6b7280"></div>Feedbacks
          </button></a>
        </nav>

        <div class="logout">
          <button class="nav-btn" id="logoutBtn" title="Sair">
            Sair
          </button>
        </div>
      </aside>

      <main class="main">
        <div class="main-header">
            <h1>Cardápio</h1>
            <button class="add-btn" type="button">+ Adicionar prato</button>
        </div>

        <div class="menu-grid" id="menuGrid">
          <!-- Itens do menu serão carregados dinamicamente via JavaScript -->
        </div>

        <!-- Modal Novo e Simplificado -->
        <div class="modal-backdrop" id="modalOverlay">
          <div class="modal-container">
            <div class="modal-content">
              <h2 id="modalTitle">Adicionar Prato</h2>
              
              <form id="menuForm" enctype="multipart/form-data">
                <div class="form-group">
                  <div class="form-item">
                    <label for="dishName">Nome do prato *</label>
                    <input type="text" id="dishName" placeholder="Nome do prato" required />
                  </div>
                  
                  <div class="form-row">
                    <div class="input-group">
                      <label for="dishPrice">Preço (R$) *</label>
                      <input type="number" id="dishPrice" placeholder="0.00" step="0.01" min="0" required />
                    </div>
                    <div class="input-group">
                      <label for="dishCategory">Categoria *</label>
                      <div class="select-wrapper">
                        <select id="dishCategory" required>
                          <option value="">Selecione uma categoria</option>
                          <option value="ENTRADAS">Entradas</option>
                          <option value="PRATOS_PRINCIPAIS">Pratos Principais</option>
                          <option value="SOBREMESAS">Sobremesas</option>
                          <option value="BEBIDAS">Bebidas</option>
                          <option value="LANCHES">Lanches</option>
                          <option value="PIZZAS">Pizzas</option>
                        </select>
                      </div>
                    </div>
                  </div>
                  
                  <!-- Seção de Ingredientes -->
                  <div class="form-item">
                    <label>Ingredientes *</label>
                    <div id="stockAlert" class="alert alert-warning" style="display: none;">
                      <strong>Atenção!</strong> Não há itens cadastrados no estoque. 
                      <a href="/admin/stock">Cadastre itens no estoque</a> antes de adicionar pratos.
                    </div>
                    <div id="ingredientsSection" style="display: none;">
                      <div class="ingredients-header">
                        <button type="button" id="addIngredientBtn" class="btn-add-ingredient">+ Adicionar Ingrediente</button>
                      </div>
                      <div id="ingredientsList" class="ingredients-list">
                        <!-- Ingredientes serão adicionados dinamicamente -->
                      </div>
                    </div>
                  </div>
                  
                  <!-- Campo de imagem melhorado -->
                  <div class="img-upload">
                    <label for="dishImage">Escolher Imagem</label>
                    <input type="file" id="dishImage" accept="image/*" />
                    <div class="preview-area">
                      <img id="imgPreview" alt="Preview" style="display: none;" />
                      <span id="previewName">Nenhuma imagem selecionada</span>
                    </div>
                  </div>
                </div>
              </form>

              <div class="modal-footer">
                <button id="cancelBtn" class="btn-cancel">Cancelar</button>
                <button id="saveBtn" class="btn-save">Salvar</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal de Confirmação -->
        <div id="confirmModal" class="modal-overlay">
          <div class="modal-container confirm-modal">
            <div class="confirm-content">
              <div class="confirm-icon">!</div>
              <h3 id="confirmTitle">Remover prato</h3>
              <p id="confirmMessage">Tem certeza que deseja remover este prato do cardápio?</p>
              <div class="confirm-actions">
                <button id="confirmCancel" class="btn-cancel">Cancelar</button>
                <button id="confirmOk" class="btn-confirm">Confirmar</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script th:src="@{/scripts/admin/menu.js}"></script>
  </body>
</html>
