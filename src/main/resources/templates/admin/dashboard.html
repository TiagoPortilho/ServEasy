<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServEasy - Dashboard</title>
    <link rel="stylesheet" th:href="@{/styles/design-system.css}" />
    <link rel="stylesheet" th:href="@{/styles/admin/admin-styles.css}" />
    <script th:src="@{/scripts/jwt-interceptor.js}"></script>
  </head>

  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Sidebar de navegação">
        <div class="header-box" role="banner">
          <svg class="logo-mark" width="36" height="36" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="28" fill="#f36458"/><g stroke="white" stroke-linecap="round" fill="none" stroke-width="3"><path d="M 21,9 L 21,22 C 21,30 28,30 28,30"/><line x1="28" y1="9" x2="28" y2="46"/><path d="M 35,9 L 35,22 C 35,30 28,30 28,30"/></g></svg>
          <div>
            <div class="title"><span class="serv">Serv</span><span class="easy">Easy</span></div>
            <div class="subtitle">Services.</div>
          </div>
        </div>

        <nav class="nav-list" aria-label="Navegação principal">
          <button class="nav-btn" aria-current="page">
            <div class="dot" aria-hidden="true"></div>
            Dashboard
          </button>
          <a th:href="@{/admin/menu}"><button class="nav-btn">
            <div style="width:6px;height:6px;border-radius:50%;background:var(--hairline-soft)"></div>
            Cardápio
          </button></a>
          <a th:href="@{/admin/tables}"><button class="nav-btn">
            <div style="width:6px;height:6px;border-radius:50%;background:var(--hairline-soft)"></div>
            Mesas
          </button></a>
          <a th:href="@{/admin/stock}"><button class="nav-btn">
            <div style="width:6px;height:6px;border-radius:50%;background:var(--hairline-soft)"></div>
            Estoque
          </button></a>
          <a th:href="@{/admin/feedbacks}"><button class="nav-btn">
            <div style="width:6px;height:6px;border-radius:50%;background:var(--hairline-soft)"></div>
            Feedbacks
          </button></a>
        </nav>

        <div class="logout">
          <a th:href="@{/login}">
            <button class="nav-btn" id="logoutBtn" title="Sair">Sair</button>
          </a>
        </div>
      </aside>

      <main class="main" role="main">
        <div class="main-header">
          <h1>Dashboard</h1>
        </div>

        <section class="grid" aria-live="polite">
          <div class="panel ganhos">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <div>
                <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px">Ganhos do dia</div>
                <div class="value" id="ganhosValor">R$ 0,00</div>
              </div>
              <div style="text-align:right">
                <div style="font-size:12px;color:var(--mute)">Hoje</div>
                <div style="font-size:13px;color:var(--ash)" id="ganhosHora">—</div>
              </div>
            </div>
            <div class="spark" aria-hidden="true"></div>
            <div style="display:flex;gap:16px;font-size:13px">
              <div class="meta">Pedidos: <strong style="color:var(--on-primary)" id="metaPedidos">0</strong></div>
              <div class="meta">Ticket Médio: <strong style="color:var(--on-primary)" id="metaTicket">R$ 0,00</strong></div>
            </div>
          </div>

          <div class="panel notas">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px">Notas rápidas</div>
            <textarea placeholder="Digite uma nota rápida..."></textarea>
          </div>

          <div class="panel estatisticas">
            <div class="stat-card">
              <div class="n" id="statVendas">0</div>
              <div class="l">Vendas hoje</div>
            </div>
            <div class="stat-card">
              <div class="n" id="statClientes">0</div>
              <div class="l">Clientes</div>
            </div>
            <div class="stat-card">
              <div class="n" id="statCancel">0</div>
              <div class="l">Cancelamentos</div>
            </div>
          </div>

          <div class="panel log" aria-label="Log de ações" id="logArea">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px">Log de ações</div>
          </div>

          <div class="panel abrir">
            <div>
              <div style="font-size:15px;font-weight:600;color:var(--on-primary);margin-bottom:4px">Abrir / Fechar Restaurante</div>
              <div style="font-size:13px;color:var(--mute)">Controla operações — somente demonstrativo.</div>
            </div>
            <div style="display:flex;gap:12px;align-items:center">
              <button id="toggleOps" class="toggle-btn">Iniciar Operações</button>
              <div id="opsState" style="font-size:13px;color:var(--mute)">Fechado</div>
            </div>
            <div style="font-size:13px;color:var(--mute)">Última mudança: <span id="lastChange">—</span></div>
          </div>
        </section>
      </main>
    </div>

    <script th:src="@{/scripts/admin/dashboard.js}"></script>
  </body>
</html>
