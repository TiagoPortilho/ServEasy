<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServEasy - Estoque</title>
    <link rel="stylesheet" th:href="@{/styles/design-system.css}" />
    <link rel="stylesheet" th:href="@{/styles/admin/admin-styles.css}" />
    <script th:src="@{/scripts/jwt-interceptor.js}"></script>
  </head>

  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Sidebar de navegação">
        <div class="header-box" role="banner">
          <svg class="logo-mark" width="36" height="36" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="28" fill="#f36458"/><g stroke="white" stroke-linecap="round" fill="none" stroke-width="3"><path d="M 21,9 L 21,22 C 21,30 28,30 28,30"/><line x1="28" y1="9" x2="28" y2="46"/><path d="M 35,9 L 35,22 C 35,30 28,30 28,30"/></g></svg>
          <div>
            <div class="title"><span class="serv">Serv</span><span class="easy">Easy</span></div>
            <div class="subtitle">Services.</div>
          </div>
        </div>

        <nav class="nav-list">
          <a th:href="@{/admin/dashboard}"><button class="nav-btn">
            <div style="width:6px;height:6px;border-radius:50%;background:var(--hairline-soft)"></div>
            Dashboard
          </button></a>

          <a th:href="@{/admin/menu}"><button class="nav-btn">
            <div style="width:6px;height:6px;border-radius:50%;background:var(--hairline-soft)"></div>
            Cardápio
          </button></a>

          <a th:href="@{/admin/tables}"><button class="nav-btn">
            <div style="width:6px;height:6px;border-radius:50%;background:var(--hairline-soft)"></div>
            Mesas
          </button></a>

          <button class="nav-btn" aria-current="page">
            <div class="dot" aria-hidden="true"></div>
            Estoque
          </button>
          <a th:href="@{/admin/feedbacks}"><button class="nav-btn">
            <div style="width:6px;height:6px;border-radius:50%;background:var(--hairline-soft)"></div>
            Feedbacks
          </button></a>
        </nav>

        <div class="logout">
          <a th:href="@{/login}">
            <button class="nav-btn" id="logoutBtn" title="Sair">
              Sair
            </button>
          </a>
        </div>
      </aside>

      <main class="main">
        <div class="main-header">
          <h1>Estoque</h1>
          <button class="add-btn" type="button">+ Adicionar Item</button>
        </div>

        <div class="table-container">
          <table class="stock-table">
            <thead>
              <tr>
                <th>Categoria</th>
                <th>Nome</th>
                <th>Preço Unit.</th>
                <th>Quantidade</th>
                <th>Unidade</th>
                <th>Valor Total</th>
                <th>Data Entrada</th>
                <th>Validade</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <!-- Dados serão carregados dinamicamente via JavaScript -->
            </tbody>
          </table>
        </div>

        <!-- Modal Adicionar/Editar -->
        <div class="modal-backdrop" id="modalOverlay">
          <div class="modal-container">
            <div class="modal-content">
              <h2 id="modalTitle">Adicionar Item</h2>

              <div class="form-group">
                <div class="form-item">
                  <label for="itemCategory">Categoria</label>
                  <div class="select-wrapper">
                    <select id="itemCategory" required>
                      <option value="">Selecione uma categoria</option>
                      <option value="Carnes">Carnes</option>
                      <option value="Aves">Aves</option>
                      <option value="Peixes e Frutos do Mar">Peixes e Frutos do Mar</option>
                      <option value="Hortifruti">Hortifruti</option>
                      <option value="Laticínios">Laticínios</option>
                      <option value="Ovos">Ovos</option>
                      <option value="Grãos e Cereais">Grãos e Cereais</option>
                      <option value="Massas">Massas</option>
                      <option value="Pães e Padaria">Pães e Padaria</option>
                      <option value="Temperos e Condimentos">Temperos e Condimentos</option>
                      <option value="Óleos e Gorduras">Óleos e Gorduras</option>
                      <option value="Enlatados e Conservas">Enlatados e Conservas</option>
                      <option value="Molhos">Molhos</option>
                      <option value="Bebidas">Bebidas</option>
                      <option value="Bebidas Alcoólicas">Bebidas Alcoólicas</option>
                      <option value="Sobremesas">Sobremesas</option>
                      <option value="Congelados">Congelados</option>
                      <option value="Embalagens">Embalagens</option>
                      <option value="Limpeza">Limpeza</option>
                      <option value="Descartáveis">Descartáveis</option>
                      <option value="Outros">Outros</option>
                    </select>
                  </div>
                </div>

                <div class="form-item">
                  <label for="itemName">Nome do Item</label>
                  <input type="text" id="itemName" required />
                </div>

                <div class="form-row">
                  <div class="form-item">
                    <label for="itemPrice">Preço Unitário (R$)</label>
                    <input type="text" id="itemPrice" required />
                  </div>
                  <div class="form-item">
                    <label for="itemQuantity">Quantidade</label>
                    <div class="number-wrapper">
                      <input type="number" id="itemQuantity" required />
                      <div class="spinner">
                        <button
                          type="button"
                          onclick="this.parentElement.previousElementSibling.stepUp()"
                          title="Aumentar quantidade"
                        >
                        </button>
                        <button
                          type="button"
                          onclick="this.parentElement.previousElementSibling.stepDown()"
                          title="Diminuir quantidade"
                        >
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="form-row">
                  <div class="form-item">
                    <label for="itemUnit">Unidade de Medida</label>
                    <div class="select-wrapper">
                      <select id="itemUnit" required>
                        <option value="">Selecione uma unidade</option>
                        <option value="kg">Quilograma (kg)</option>
                        <option value="g">Grama (g)</option>
                        <option value="L">Litro (L)</option>
                        <option value="ml">Mililitro (ml)</option>
                        <option value="unidades">Unidades</option>
                        <option value="pacotes">Pacotes</option>
                        <option value="caixas">Caixas</option>
                      </select>
                    </div>
                  </div>
                  <div class="form-item">
                    <label for="itemMinQuantity">Quantidade Mínima</label>
                    <input type="number" id="itemMinQuantity" required />
                  </div>
                </div>

                <div class="form-row">
                  <div class="form-item">
                    <label for="itemEntry">Data de Entrada</label>
                    <input type="date" id="itemEntry" />
                  </div>
                  <div class="form-item">
                    <label for="itemExpiry">Data de Validade</label>
                    <input type="date" id="itemExpiry" />
                  </div>
                </div>
              </div>

              <div class="modal-footer">
                <button id="cancelBtn" class="btn-cancel">Cancelar</button>
                <button id="saveBtn" class="btn-save">Salvar</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal de Confirmação -->
        <div id="confirmModal" class="modal-backdrop">
          <div class="modal-container confirm-modal">
            <div class="confirm-content">
              <div class="confirm-icon">!</div>
              <h3>Remover Item</h3>
              <p id="confirmMessage">
                Tem certeza que deseja remover este item do estoque?
              </p>
              <div class="confirm-actions">
                <button id="confirmCancel" class="btn-cancel">Cancelar</button>
                <button id="confirmOk" class="btn-confirm">Confirmar</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script th:src="@{/scripts/admin/stock.js}"></script>
  </body>
</html>
