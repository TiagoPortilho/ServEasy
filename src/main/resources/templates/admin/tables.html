<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServEasy - Mesas</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../../styles/admin/admin-styles.css" />
    
    <!-- JWT Interceptor - deve ser carregado primeiro -->
    <script src="/scripts/jwt-interceptor.js"></script>
  </head>

  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Sidebar de navegação">
        <div class="header-box" role="banner">
          <div style="display: flex; align-items: center; gap: 0.9rem">
            <div
              style="
                width: 46px;
                height: 46px;
                border-radius: 10px;
                background: linear-gradient(
                  90deg,
                  var(--btn-bg),
                  var(--btn-hover-end)
                );
                box-shadow: 0 6px 18px var(--btn-shadow);
              "
            ></div>
            <div>
              <div class="title">ServEasy</div>
              <div class="subtitle">Services.</div>
            </div>
          </div>
        </div>

        <nav class="nav-list">
          <a th:href="@{/admin/dashboard}"
            ><button class="nav-btn">
              <div
                style="
                  width: 10px;
                  height: 10px;
                  border-radius: 50%;
                  background: #6b7280;
                "
              ></div>
              Dashboard
            </button></a
          >

          <a th:href="@{/admin/menu}"
            ><button class="nav-btn">
              <div
                style="
                  width: 10px;
                  height: 10px;
                  border-radius: 50%;
                  background: #6b7280;
                "
              ></div>
              Cardápio
            </button></a
          >

          <button class="nav-btn" aria-current="page">
            <div class="dot" aria-hidden="true"></div>
            Mesas
          </button>

          <a th:href="@{/admin/stock}"
            ><button class="nav-btn">
              <div
                style="
                  width: 10px;
                  height: 10px;
                  border-radius: 50%;
                  background: #6b7280;
                "
              ></div>
              Estoque
            </button></a
          >
          <a th:href="@{/admin/feedbacks}"
            ><button class="nav-btn">
              <div
                style="
                  width: 10px;
                  height: 10px;
                  border-radius: 50%;
                  background: #6b7280;
                "
              ></div>
              Feedbacks
            </button></a
          >
        </nav>

        <div class="logout">
          <a th:href="@{/login}">
            <button class="nav-btn" id="logoutBtn" title="Sair">Sair</button>
          </a>
        </div>
      </aside>

      <main class="main">
        <div class="main-header">
          <h1>Mesas</h1>
          <button class="add-btn" id="openAdd">+ Adicionar mesa</button>
        </div>

        <div class="tables-grid">
          <!-- Mesas aparecerão aqui -->
        </div>

        <!-- Modal de Inserção -->
        <div class="modal-overlay" id="modalOverlay">
          <div class="modal-container">
            <div class="modal-content">
              <h2>Adicionar Mesa</h2>

              <div class="form-group">
                <div class="input-group">
                  <label>Número da Mesa</label>
                  <input type="text" id="tableNumber" placeholder="Ex: 15" />
                </div>

                <div class="input-group">
                  <label>Quantidade de Lugares</label>
                  <input type="number" id="tableCapacity" min="1" max="20" value="4" />
                </div>
                
                <div class="input-group">
                  <label>Status da Mesa</label>
                  <div class="select-wrapper">
                    <select id="tableStatus">
                      <option value="DISPONIVEL">Disponível</option>
                      <option value="OCUPADA">Ocupado</option>
                      <option value="RESERVADA">Reservada</option>
                      <option value="MANUTENCAO">Manutenção</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="modal-footer">
                <button id="cancelBtn" class="btn-cancel">
                  <i class="fas fa-times"></i> Cancelar
                </button>
                <button id="saveBtn" class="btn-save">
                  <i class="fas fa-check"></i> Salvar
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal de Confirmação -->
        <div id="confirmModal" class="modal-overlay">
          <div class="modal-container confirm-modal">
            <div class="confirm-content">
              <div class="confirm-icon">!</div>
              <h3 id="confirmTitle">Remover mesa</h3>
              <p id="confirmMessage">
                Tem certeza que deseja remover esta mesa?
              </p>
              <div class="confirm-actions">
                <button id="confirmCancel" class="btn-cancel">Cancelar</button>
                <button id="confirmOk" class="btn-confirm">Confirmar</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="../../scripts/admin/tables.js"></script>
  </body>
</html>
