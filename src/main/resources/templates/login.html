<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServEasy - Login</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/styles/login-styles.css}" />
  </head>

  <body>
    <div class="login-container">
      <!-- Cabeçalho com fundo laranja -->
      <div class="header-box">
        <div class="title">ServEasy</div>
        <div class="subtitle">Services.</div>
      </div>

      <!-- Formulário -->
      <form>
        <div class="mb-3">
          <label for="username" class="form-label">Usuário</label>
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Digite seu usuário"
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Digite sua senha"
          />
        </div>
        <button type="submit" class="btn btn-login mt-3" id="AccessButton">
          Acessar
        </button>
      </form>
    </div>
    <script th:src="@{/scripts/login.js}"></script>
  </body>
</html>
