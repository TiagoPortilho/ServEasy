spring.application.name=ServEasy

# ============================================
# Profile: Production
# ============================================

# Database Configuration (use environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/serveasy_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# DevTools - Disabled in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Logging - Production (minimal)
logging.level.root=WARN
logging.level.com.tiagoportilho.ServEasy=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Log to file
logging.file.name=logs/serveasy.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# Swagger/OpenAPI - Disabled in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Error Handling - Hide details in production
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Security Headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
