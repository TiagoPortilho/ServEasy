spring.application.name=ServEasy

# ============================================
# Profile: Test
# ============================================

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.port=0

# DevTools
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Logging - Minimal during tests
logging.level.root=WARN
logging.level.com.tiagoportilho.ServEasy=INFO
logging.level.org.springframework.web=WARN

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# JWT Configuration
app.jwt.secret=TestSecretKeyForServEasyJWTTokenGenerationAndValidationForTests01
app.jwt.expiration=3600000

# Swagger/OpenAPI - Disabled during tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
